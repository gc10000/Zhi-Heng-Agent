name: product-knowledge-rag

# 当前用于 Windows 本机调试；端口仅绑定本机回环地址，无需 SSH 隧道。
# 操作步骤见 docs/WINDOWS_DOCKER.md。
services:
  redis:
    image: redis:7.4.6-alpine
    profiles: [tasks]
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    image: product-knowledge-worker:m2
    profiles: [tasks]
    build:
      context: .
      dockerfile: deploy/worker/Dockerfile
    restart: unless-stopped
    command: [celery, -A, 'app.infrastructure.queue.celery_app:celery_app', worker, '--loglevel=WARNING', '--concurrency=1', -Q, '${M2_QUEUE_NAME:-knowledge-import}']
    env_file:
      - .env
    environment:
      # 容器只接收服务地址/对象键，模型从显式宿主桥接访问。
      MONGO_URL: mongodb://mongo:27017
      MINIO_ENDPOINT: minio:9000
      MILVUS_URL: http://milvus:19530
      REDIS_URL: redis://redis:6379/0
      MODEL_HOST_URL: http://host.docker.internal:${MODEL_HOST_PORT:-8011}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - worker-cache:/var/lib/knowledge-worker

  evaluation-worker:
    # 只消费评测ID，实际模型执行沿受控宿主，避免Linux重复安装CUDA模型。
    image: product-knowledge-worker:m2
    profiles: [evaluation]
    build:
      context: .
      dockerfile: deploy/worker/Dockerfile
    restart: unless-stopped
    command: [celery, -A, 'app.infrastructure.queue.celery_app:celery_app', worker, '--loglevel=WARNING', '--concurrency=1', -Q, '${M6_QUEUE_NAME:-knowledge-evaluation}']
    environment:
      REDIS_URL: redis://redis:6379/0
      M6_QUEUE_NAME: ${M6_QUEUE_NAME:-knowledge-evaluation}
      MODEL_HOST_URL: http://host.docker.internal:${MODEL_HOST_PORT:-8011}
      MODEL_HOST_TOKEN: ${MODEL_HOST_TOKEN:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy
  etcd:
    # Milvus 的元数据存储，只在容器网络中使用，无需对外发布端口。
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # 社区版已改为源码分发，从官方固定提交构建，避免依赖已无法拉取的旧镜像。
    image: product-knowledge-minio:2025-10-15
    build:
      context: ./deploy/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在环境文件中填写 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在环境文件中填写 MINIO_SECRET_KEY}
    command: [server, /data, --console-address, ":9001"]
    ports:
      # 本机 9000 已被其他项目占用，使用 .env 的 MINIO_API_PORT 调整发布端口。
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.6.10
    restart: unless-stopped
    command: [milvus, run, standalone]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?请在环境文件中填写 MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?请在环境文件中填写 MINIO_SECRET_KEY}
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 15

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  # 命名卷保存持久化数据；不要执行 docker compose down -v，避免删除知识库和会话。
  etcd-data:
  minio-data:
  milvus-data:
  mongo-data:
  redis-data:
  worker-cache:

