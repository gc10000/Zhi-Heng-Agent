# Docker服务重建会换IP；使用内置DNS重新解析，避免回滚/恢复后继续访问旧IP。
resolver 127.0.0.11 valid=5s ipv6=off;
upstream zhi_heng_api {
    zone zhi_heng_api 64k;
    server api:8000 resolve;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 101m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^/(api/|health/) {
        proxy_pass http://zhi_heng_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 180s;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
