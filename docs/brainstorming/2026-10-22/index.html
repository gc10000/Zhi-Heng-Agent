function sourcesView(){return `<div class="sources"><div class="eyebrow">RESEARCH / VERIFIED REPOSITORY LINKS</div><h2>六个参考项目，六种值得借鉴的能力。</h2><p>参考功能设计与交互结构；下面的提炼不是源码移植承诺，也不代表完成了项目部署测试。</p><div class="repogrid">${repos.map(r=>`<article class="repo"><h3>${r[0]}</h3><p>${r[2]}</p><div class="license">许可证：${r[3]}</div><a target="_blank" rel="noopener noreferrer" href="https://github.com/${r[1]}">查看 GitHub 仓库 ↗</a></article>`).join('')}</div><div class="tradeoff">查阅范围：GitHub 仓库搜索与页面、六个 README 和许可证、五个前端 package.json、AnythingLLM 的 workspace 模型、Dify 的检索测试页面。完整提案和源文件链接见同目录下的 PROPOSAL.md 与 research/sources.json。品牌与业务原型为本次独立制作。</div></div>`}

 if(a==='model')modal('确认设备型号','<p class="muted">正式版本会根据实体匹配候选展示型号卡片，让用户确认后再约束检索范围。</p><div class="flowsteps"><button data-action="choose-model" data-model="至像 M3070DHF">M3070DHF</button><button data-action="choose-model" data-model="至像 M3070DXF">M3070DXF</button><button data-action="choose-model" data-model="至像 M3070 系列">暂按系列查询</button></div><p class="evidence-note">型号仅演示选择状态，不表示这些型号的所有功能完全相同。</p>');

 if(a==='checklist'){$('#steps').innerHTML='<div class="flowsteps"><button data-action="step">○ 找到任务栏图标</button><button data-action="step">○ 打开接收设置</button><button data-action="step">○ 检查保存位置</button></div>';toast('点击清单步骤可标记完成；刷新后不保留。')}

 if(a==='feedback')modal('记录知识问题','<p class="muted">把错误和证据关联起来，让下一次改进有明确目标。</p><div class="flowsteps"><button data-action="feedback-done">型号不匹配</button><button data-action="feedback-done">证据不支持答案</button><button data-action="feedback-done">缺少所需资料</button></div><p class="evidence-note">未来保存 message_id、query_run_id、相关引用和原因；人工确认后加入回归集。</p>');

 if(a==='upload'){b.disabled=true;$('#pending').textContent='1';const phases=['接收原件','图文解析','切片预览','向量化','等待人工发布'];let i=0;const tick=()=>{if(!$('#pipeline')){b.disabled=false;return}$('#pipeline').innerHTML='<strong>模拟导入 / 示例资料</strong><span>'+phases[i]+'</span><span class="preview-label">这是本地计时动画，没有上传文件</span>';i++;if(i<phases.length)setTimeout(tick,600);else{$('#pending').textContent='0';b.disabled=false;toast('模拟导入完成；正式版本应支持失败重试和版本发布。')}};tick()}
